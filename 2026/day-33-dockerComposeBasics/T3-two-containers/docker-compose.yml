services:
    wordpress:
        image: wordpress
        container_name: wordpress_con
        restart: always
        ports:
            - "${APP_PORT}:80"
        environment:
          WORDPRESS_DB_HOST: sql
          WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
          WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
          WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}

        volumes:
          - wordpress:/var/www/html
        depends_on:
          - sql
    
    sql: # this service name will be used as reference in host of wordpress
        image: mysql
        container_name: mysqldb_con  
        restart: always
        environment:
          MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
          MYSQL_DATABASE: ${MYSQL_DATABASE}  # this database will be automatically created and mount on mysql_data volume
        volumes:
          - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  wordpress: